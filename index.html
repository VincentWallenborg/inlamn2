<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<body id="home">
    <header>
        <div class="continer">
            <div class="logo">YOUR RECEPIES</div>
            <nav class ="desktopNav">
                <a href="#home">HOME</a>
                <a href="#recepis">RECEPIS</a>
                <a href="#add">ADD YOUR OWN</a>
        </nav>
            <img class="hamburger" src="assets/icons/bars-solid.png" alt="hamburger">
        </div>
        <nav class="phoneNav">
            <a href="#home">HOME</a>
            <a href="#recepis">RECEPIS</a>
            <a href="#add">ADD YOUR OWN</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>ALL THE RECIPES YOU'LL EVER NEED</h1>
        </section>
        <div class="filter" id="recepis">
            <h2>Select what recipes you are looking for</h2>
            <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="">All</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Dessert">Dessert</option>
                </select>
            <button class="filterButton" type="submit">Apply filters</button>
        </div> 
        <section class="recepiePage">

        </section>
        <section class="addOwn" id="add">
            <h2>Add your own</h2>
            <form  id="addForm">
                <label for="fname">Title</label><br>
                <input type="text" id="fTitle" name="fTitle"><br>
                <label for="lname">How long does it take</label><br>
                <input type="text" id="fTime" name="Ftime"><br>
                <label for="Description">Description</label><br>
                <input type="text" id="fDescription" name="Description"><br>
                <label for="fFile">Picture</label><br>
                <input type="file" id="fFile" name="fFile"><br><br>
                <input type="submit" value="Submit">
            </form> 
        </section>
    </main>
    <footer>
        <a href="">Learn More</a>
        <a href="">FAQ</a>
        <a href="">About Us</a>
    </footer>
</body>
</html>
